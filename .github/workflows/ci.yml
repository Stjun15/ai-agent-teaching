name: CI

on:
  push:
    branches: ["dev", "main"]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 版本必须与 pnpm-workspace.yaml 的写法匹配：pnpm 9 要求 packages 字段，
      # 本仓库是纯配置型 workspace（无 packages），且本地开发用 pnpm 12。
      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      # 只扫源码目录：仓库根还有生成的审计产物与部署脚本，不属于工程门禁范围。
      - name: ESLint
        run: pnpm lint

      - name: TypeScript
        run: pnpm typecheck

      - name: 标准测试框架（Vitest + 覆盖率）
        run: pnpm test:coverage
